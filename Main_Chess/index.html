<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xadrez online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main id="home">
  <h1>Xadrez</h1>
  <p class="mt">Crie uma partida, mande o link e jogue em tempo real. Sem cadastro.</p>
  <div class="card">
    <input id="name" placeholder="Seu nome" maxlength="20" autocomplete="nickname">
    <div class="row">
      <select id="tc" aria-label="Tempo">
        <option value="1+0">1 min</option>
        <option value="3+0">3 min</option>
        <option value="3+2">3 min + 2 s</option>
        <option value="5+0">5 min</option>
        <option value="10+0" selected>10 min</option>
        <option value="15+10">15 min + 10 s</option>
        <option value="30+0">30 min</option>
        <option value="0+0">Sem relógio</option>
      </select>
      <select id="clr" aria-label="Cor">
        <option value="r">Cor aleatória</option>
        <option value="w">Brancas</option>
        <option value="b">Pretas</option>
      </select>
    </div>
    <button class="p" id="create">Criar partida</button>
  </div>
  <div class="card">
    <div class="row">
      <input id="code" placeholder="Código da sala" maxlength="6" autocapitalize="characters">
      <button id="join">Entrar</button>
    </div>
  </div>
</main>

<main id="game" hidden>
  <section class="bd">
    <div class="pl" id="top"><span class="nm"></span><span class="cap"></span><span class="clk"></span></div>
    <div id="board"></div>
    <div class="pl" id="bot"><span class="nm"></span><span class="cap"></span><span class="clk"></span></div>
  </section>
  <aside>
    <div id="status"></div>
    <div id="moves"></div>
    <div class="btns">
      <button id="flip" title="Virar o tabuleiro">Virar</button>
      <button id="copy">Copiar link</button>
      <button id="draw" hidden>Propor empate</button>
      <button id="decl" hidden>Recusar empate</button>
      <button id="resign" hidden>Desistir</button>
      <button id="rematch" class="p" hidden>Revanche</button>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <form id="chatf"><input id="msg" placeholder="Mensagem" maxlength="300" autocomplete="off"></form>
    <small id="spec" class="mt"></small>
  </aside>
</main>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
